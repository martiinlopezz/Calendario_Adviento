<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Calendario de adviento</title>
  <meta name="theme-color" content="#0b1426">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Adviento">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="nieve"></canvas>
  <canvas id="confeti"></canvas>

  <!-- Intro: sobre con su nombre -->
  <section id="intro">
    <button id="sobre" aria-label="Abrir el sobre">
      <div class="sobre">
        <div class="atras"></div>
        <div class="solapa"></div>
        <div class="carta"><span id="intro-para"></span></div>
        <div class="frente"></div>
        <div class="sello">❤</div>
      </div>
      <p class="toca">Toca para abrir</p>
    </button>
  </section>

  <div id="app">
    <header>
      <h1 id="titulo"></h1>
      <p id="subtitulo"></p>
    </header>
    <main id="grid"></main>
    <p id="progreso"></p>
  </div>

  <!-- Visor de contenido -->
  <div id="visor" aria-hidden="true">
    <article class="tarjeta" role="dialog" aria-modal="true">
      <div id="contenido"></div>
      <button id="cerrar" class="boton">Cerrar</button>
    </article>
  </div>

  <!-- Pantalla de la clave (solo sale si no llega en el enlace) -->
  <div id="clave" hidden>
    <div class="clave-caja">
      <p>🔑 Escribe la clave que te envié junto con el enlace</p>
      <input id="clave-input" type="text" autocomplete="off" autocapitalize="none"
             autocorrect="off" spellcheck="false" placeholder="clave">
      <button id="clave-ok" class="boton">Entrar</button>
      <p id="clave-error" hidden></p>
    </div>
  </div>

  <div id="toast" role="status"></div>

  <div id="instalar" hidden>
    <p>📲 Para abrirlo cada día de un toque, añádelo a tu pantalla de inicio:<br>
      <b>iPhone:</b> Compartir → «Añadir a pantalla de inicio»<br>
      <b>Android:</b> menú ⋮ → «Añadir a pantalla de inicio»</p>
    <button id="instalar-cerrar" class="boton">Entendido</button>
  </div>

  <div id="prueba" hidden>
    <b>🧪 Modo prueba</b>
    <label>Fecha: <input type="date" id="prueba-fecha"></label>
    <button id="prueba-reset">Reiniciar puertas</button>
    <button id="prueba-sobre">Ver sobre</button>
    <button id="prueba-clave">Olvidar clave</button>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
